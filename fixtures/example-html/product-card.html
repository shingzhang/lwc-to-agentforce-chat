<!--
  Fictional product-card prototype for testing Entry 2 (HTML → LWC).
  Willa's Corner Grocery style. Fully fictional — no real customer data.
-->

<div class="product-card" style="border-radius: 12px; padding: 16px; background: #FFF8ED;">

  <img src="https://cdn.example.com/products/sku-42-coffee.jpg"
       alt="Willa's Corner Ground Coffee">

  <div class="name" style="font-family: Inter; font-weight: 600; color: #2D2D2D;">
    Willa's Corner Ground Coffee
  </div>

  <div class="price" style="color: #6B8E4E; font-weight: 700;">
    $12.99 / 12oz
  </div>

  <div class="qty-row">
    <label for="qty-input">Quantity</label>
    <input id="qty-input"
           type="number"
           min="1"
           max="12"
           value="1"
           onchange="handleQtyChange(this.value)">
  </div>

  <button class="cta"
          style="background: #6B8E4E; color: white; border-radius: 8px; padding: 8px 16px;"
          onclick="handleAddToBag('SKU-42')">
    Add to bag
  </button>

</div>
